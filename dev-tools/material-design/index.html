<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/branding/icons/icon-32.png?no-inline" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Triadic 素材感の比較</title>
  </head>
  <body>
    <main>
      <header>
        <a href="../index.html">開発ツール一覧</a>
        <h1>素材感の比較</h1>
        <p>現在の仕様色で比較します。選んだ素材と強さはURLに残り、製品には反映されません。</p>
      </header>
      <div class="controls">
        <label for="strength">質感の強さ</label>
        <input id="strength" type="range" min="0" max="100" step="5" value="60" />
        <output id="strength-value" for="strength">60%</output>
      </div>
      <fieldset id="materials" aria-label="素材感の候補"></fieldset>
      <div class="selection-heading"><h2 id="selected-name">マットな紙</h2><output id="selection-status" role="status" aria-label="選択中の素材感"></output></div>
      <p id="material-description"></p>
      <div id="large-previews"></div>
      <details>
        <summary>仕様カラーパレット</summary>
        <div class="palette-region"><table id="palette"><thead><tr><th scope="col">用途</th><th scope="col">ライト</th><th scope="col">ダーク</th></tr></thead><tbody></tbody></table></div>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
