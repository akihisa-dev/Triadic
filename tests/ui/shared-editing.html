<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><link rel="icon" href="/branding/icons/icon-32.png?no-inline"><title>共有編集中の入力保護</title>
<style>body{margin:0;font:14px system-ui}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap}iframe{width:100%;height:78vh;border:0}pre{margin:8px;white-space:pre-wrap;max-height:12vh;overflow:auto}</style></head>
<body>
