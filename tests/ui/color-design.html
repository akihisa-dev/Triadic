<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/branding/icons/icon-32.png?no-inline" />
    <link rel="stylesheet" href="./color-design.css" />
    <title>Triadic カラーデザイン確認</title>
  </head>
  <body>
    <header class="design-header">
      <h1>カラーデザイン確認</h1>
      <p>確認案の変更はこのページ内だけに反映されます。製品への反映は確認後に行います。</p>
      <div class="design-controls">
        <fieldset><legend>画面見本</legend>
          <label><input type="radio" name="appearance" value="draft" checked />確認案</label>
          <label><input type="radio" name="appearance" value="spec" />仕様の配色</label>
        </fieldset>
        <button type="button" id="reset-colors">確認案を初期状態に戻す</button>
        <a href="./preview.html?data=large">実装画面</a>
        <output id="design-status" role="status">準備中</output>
      </div>
    </header>
    <main id="color-design"></main>
    <script type="module" src="./color-design.ts"></script>
  </body>
</html>
